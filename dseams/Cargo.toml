[package]
name = "dseams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust d-SEAMS API: CHILL/+, Steinhardt, neighbours, rings, cages, RDF/CN, H-bonds, density, fingerprints, contacts, domains, prisms, monolayers, symmetry and brine; LAMMPS/XYZ, optional CON/chemfiles"
authors.workspace = true
license = "MIT"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/dseams"
readme = "README.md"
keywords = ["molecular-dynamics", "ice", "chemistry", "clathrate", "simulation"]
categories = ["science", "api-bindings"]
include = [
  "/src/**",
  "/build.rs",
  "/tests/ice.rs",
  "/tests/readers.rs",
  "/tests/cpp_match.rs",
  "/examples/**",
  "/tests/data/**",
  "/README.md",
  "/LICENSE",
]

[lib]
name = "seams"

[features]
bundled = ["dseams-sys/bundled"]

[dependencies]
dseams-sys = { workspace = true }

[[example]]
name = "minimal"
path = "examples/minimal.rs"

[[example]]
name = "ice_ih"
path = "examples/ice_ih.rs"

[[example]]
name = "binding_overhead"
path = "examples/binding_overhead.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
