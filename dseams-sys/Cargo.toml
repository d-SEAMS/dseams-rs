[package]
name = "dseams-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raw d-SEAMS FFI: CHILL/+, Steinhardt, neighbours, rings, cages, RDF/CN, H-bonds, density, fingerprints, contacts, domains, prisms, monolayers, symmetry and brine; LAMMPS/XYZ, optional CON/chemfiles"
authors.workspace = true
# The crate code and d-SEAMS are MIT. vendor/eigen, used by the bundled
# feature, is Eigen 3.4.0: MPL-2.0, with AlignedBox.h under BSD-3-Clause and
# BFloat16.h under Apache-2.0.
license = "MIT AND MPL-2.0 AND BSD-3-Clause AND Apache-2.0"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/dseams-sys"
readme = "README.md"
keywords = ["molecular-dynamics", "ice", "chemistry", "ffi", "simulation"]
categories = ["external-ffi-bindings", "science"]
links = "seams"
build = "build.rs"
include = [
  "/src/**",
  "/build.rs",
  "/sources.txt",
  "/README.md",
  "/LICENSE",
  "/vendor/**",
]

[lib]
name = "seams_sys"

[features]
# Compile libseams from the seams-core sources in vendor/ (see vendor.py)
# instead of linking an installed one. pkg-config enables chemfiles 0.10
# and readcon-core 0.16 when they are available. SEAMS_LIBDIR still wins.
bundled = ["dep:cc", "dep:linkcell"]

[dependencies]
linkcell = { version = "=0.6.0", optional = true }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"], optional = true }
pkg-config = "0.3.27"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
