[package]
name = "dseams-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raw FFI bindings to libseams, the d-SEAMS C API"
authors.workspace = true
# The crate code and d-SEAMS are MIT. vendor/eigen, used by the bundled
# feature, is Eigen 3.4.0: MPL-2.0, with AlignedBox.h under BSD-3-Clause and
# BFloat16.h under Apache-2.0.
license = "MIT AND MPL-2.0 AND BSD-3-Clause AND Apache-2.0"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/dseams-sys"
readme = "README.md"
keywords = ["molecular-dynamics", "ice", "chemistry", "ffi", "simulation"]
categories = ["external-ffi-bindings", "science"]
links = "seams"
build = "build.rs"
include = [
  "/src/**",
  "/build.rs",
  "/sources.txt",
  "/README.md",
  "/LICENSE",
  "/vendor/**",
]

[lib]
name = "seams_sys"

[features]
default = ["bundled"]
# Compile libseams from the seams-core sources in vendor/ (see vendor.py)
# instead of linking an installed one. That build reads LAMMPS dumps and
# XYZ, not .con or the chemfiles formats. SEAMS_LIBDIR still wins.
bundled = ["dep:cc"]

[dependencies]

[build-dependencies]
cc = { version = "1.2", features = ["parallel"], optional = true }
pkg-config = "0.3.27"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
