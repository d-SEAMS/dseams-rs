name: CI
# Builds seams-core at the tag in seams-core.env and tests both crates
# against it. cargo publish runs with --dry-run. A push to main deploys
# the book and the rustdoc pages to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  libseams:
    name: Against a seams-core build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dseams-rs
      - name: Read the seams-core pin
        id: pin
        run: |
          . dseams-rs/seams-core.env
          echo "repo=${SEAMS_CORE_REPO#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "ref=$SEAMS_CORE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: seams-core
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: seams-core/pixi.toml
          environments: default
          cache-key: pixi-dseams-rs-
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Build libseams and the C++ oracle
        working-directory: seams-core
        run: |
          pixi run meson setup bbdir -Dwith_tests=true -Dwith_cli=false
          pixi run ninja -C bbdir src/libseams.so bindings/binding_oracle
      - name: Format, lint, test
        working-directory: dseams-rs
        env:
          OMP_NUM_THREADS: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: |
          core="$GITHUB_WORKSPACE/seams-core"
          export SEAMS_LIBDIR="$core/bbdir/src"
          export SEAMS_INCLUDE="$core/include:$core/bbdir/src"
          export SEAMS_CPP_ORACLE="$core/bbdir/bindings/binding_oracle"
          export SEAMS_SOURCE_ROOT="$core"
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked -- --test-threads=1
          cargo test --locked --examples -- --test-threads=1
          cargo run --locked --example lang_tasks
          cargo run --locked --example ice_ih -- "$core/input/traj/ice1h.lammpstrj"
          cargo doc --locked --no-deps
      - name: Link through pkg-config
        working-directory: dseams-rs
        env:
          OMP_NUM_THREADS: "1"
          CARGO_TARGET_DIR: target/pkgconfig
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/seams-core/bbdir/meson-uninstalled"
          cargo test --locked -- --test-threads=1
      - name: Declarations match seams.h
        working-directory: dseams-rs
        run: |
          python3 dseams-sys/gen_sys.py "$GITHUB_WORKSPACE/seams-core/include/seams.h" "$RUNNER_TEMP/lib.rs"
          diff -u dseams-sys/src/lib.rs "$RUNNER_TEMP/lib.rs"
      # vendor/ is generated and gitignored, so cargo sees it as uncommitted.
      - name: Package and dry-run publish
        working-directory: dseams-rs
        run: |
          export SEAMS_LIBDIR="$GITHUB_WORKSPACE/seams-core/bbdir/src"
          python3 dseams-sys/vendor.py --source "$GITHUB_WORKSPACE/seams-core"
          cargo package --workspace --locked --allow-dirty
          cargo publish --workspace --locked --dry-run --allow-dirty

  bundled:
    name: Bundled libseams
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dseams-rs
      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install 1.85.0 --profile minimal
      - name: Vendor the pinned seams-core sources and Eigen
        working-directory: dseams-rs
        run: python3 dseams-sys/vendor.py
      - name: Test with the bundled libseams
        working-directory: dseams-rs
        env:
          OMP_NUM_THREADS: "1"
          CC: gcc
          CXX: g++
        run: |
          cargo +stable clippy --features bundled --all-targets --locked -- -D warnings
          cargo +stable test --features bundled --locked --test ice --examples -- --test-threads=1
          cargo +stable run --features bundled --locked --example lang_tasks
      - name: Rustdoc as docs.rs builds it
        working-directory: dseams-rs
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +stable doc --locked --no-deps
      - name: Minimum supported Rust
        working-directory: dseams-rs
        env:
          CC: gcc
          CXX: g++
        run: cargo +1.85.0 build --features bundled --all-targets --locked

  docs:
    name: Book and rustdoc coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install mdBook 0.5.4
        run: |
          curl -fsSL -o mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version
      - name: Rustdoc coverage
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --locked --no-deps --workspace
          python3 docs/check_rustdoc.py target/doc
      # The rustdoc pages go under api/ so the book's API page can link them.
      # rustdoc's help and settings pages link api/index.html, which a
      # stable workspace build does not write.
      - name: Build the book and check links
        run: |
          mdbook build docs
          cp -r target/doc docs/book/api
          cp docs/rustdoc-index.html docs/book/api/index.html
          python3 docs/check_book.py docs/book
      # The site's own URL is skipped: docs/book is that site, checked here
      # before it is deployed. 404.html uses site-absolute links, and
      # static.files holds the rustdoc font licenses. doi.org redirects to
      # a publisher that answers CI runners with 403; check_book.py
      # already resolves the DOI and accepts that 403.
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 4
            --accept 200,206,429
            --exclude '^https://rust\.dseams\.info/'
            --exclude '^https://doi\.org/'
            --extensions md,html
            --exclude-path docs/book/404.html
            --exclude-path 'docs/book/api/static\.files'
            README.md docs/book
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  pages:
    name: Deploy the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [libseams, bundled, docs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The published site, as readers get it: every page of the deployed
  # artifact is a lychee input at its live address, so relative links
  # resolve against the page they are on. A live 404 fails the run.
  live-links:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artifact
      - name: Page list
        run: |
          mkdir site && tar -xf artifact/artifact.tar -C site
          (cd site && find . -name '*.html' -not -name 404.html -not -path './api/static.files/*' \
            | sed 's#^\./#https://rust.dseams.info/#') > pages.txt
          wc -l pages.txt
      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 8
            --accept 200,202,206,429
            --remap "https://github.com/d-SEAMS/dseams-rs/(blob|tree)/main file://${{ github.workspace }}"
            --exclude '^https://doi\.org/'
            --files-from pages.txt
          token: ${{ secrets.GITHUB_TOKEN }}
