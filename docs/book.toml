[book]
title = "dseams Rust Documentation"
authors = [
  "Rohit Goswami",
  "Ruhila Goswami (ORCID 0000-0002-5443-9356)",
]
description = "Rust API and user guide for d-SEAMS ice, clathrate cage and primitive ring analysis"
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
site-url = "/"
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/d-SEAMS/dseams-rs"
mathjax-support = true

[output.html.playground]
runnable = false
