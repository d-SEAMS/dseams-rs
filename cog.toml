# Cocogitto 7+ prepares one dseams-rs version commit and v-prefixed tag.
from_latest_tag = true
ignore_merge_commits = true
disable_changelog = true
disable_bump_commit = false
generate_mono_repository_global_tag = true
tag_prefix = "v"
skip_ci = "[skip ci]"
skip_untracked = false

pre_bump_hooks = [
    "cargo set-version --workspace {{version}}",
    "python3 -m cogapp -r -I ci/version $(awk 'NF && $1 !~ /^#/' ci/version/files.txt)",
    "cargo update --workspace --offline",
    "towncrier build --yes --version {{version}}",
    "cargo metadata --locked --no-deps --format-version 1 > /dev/null",
]

post_bump_hooks = [
    "git --no-pager show --stat HEAD",
    "echo \"Prepared v{{version}}. Push the version commit and tag to run the publish workflow.\"",
]

[commit_types]
feat = { changelog_title = "Features" }
fix = { changelog_title = "Bug Fixes" }
perf = { changelog_title = "Performance" }
bench = { changelog_title = "Benchmarks" }
refactor = { changelog_title = "Refactoring" }
docs = { changelog_title = "Documentation" }
test = { changelog_title = "Tests" }
build = { changelog_title = "Build System" }
ci = { changelog_title = "CI" }
chore = { changelog_title = "Miscellaneous" }
style = { changelog_title = "Style" }
revert = { changelog_title = "Reverts" }

[changelog]
path = "CHANGELOG.md"

[git_hooks]

[bump_profiles]
